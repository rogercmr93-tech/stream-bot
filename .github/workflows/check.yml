name: Revisar directos

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (mínimo que permite GitHub)
  workflow_dispatch:         # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write            # necesario para guardar state.json en el repo

concurrency:
  group: revisar-directos
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar streamers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
        run: python bot.py --once

      - name: Guardar estado
        run: |
          if [ -n "$(git status --porcelain state.json streamers.json)" ]; then
            git config user.name "stream-bot"
            git config user.email "stream-bot@users.noreply.github.com"
            git add state.json streamers.json
            git commit -m "Actualizar estado y lista de streamers"
            git pull --rebase
            git push
          fi
